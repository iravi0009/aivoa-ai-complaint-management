services:
  postgres:
    image: postgres:16
    container_name: aivoa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aivoa_qms
      POSTGRES_USER: aivoa_user
      POSTGRES_PASSWORD: aivoa_password
    ports:
      - "5433:5432"
    volumes:
      - aivoa_postgres_data:/var/lib/postgresql/data

volumes:
  aivoa_postgres_data: